# Deepwick for Midnight Commander (16 colors). Uses ANSI slots: use a Deepwick
# terminal theme. lightgray=Foreground black=Overlay gray=Muted blue=Blue.
[skin]
    description = Deepwick (16 colors)

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = lightgray;default
    selected = black;blue
    marked = brown;default;bold
    markselect = brown;blue;bold
    gauge = black;blue
    input = lightgray;black
    inputunchanged = gray;black
    inputmark = black;blue
    inputhistory = lightgray;black
    commandhistory = lightgray;black
    disabled = gray;black
    reverse = black;blue
    commandlinemark = black;blue
    header = blue;default;bold
    shadow = gray;black

[dialog]
    _default_ = lightgray;black
    dfocus = black;blue
    dhotnormal = yellow;black
    dhotfocus = yellow;blue
    dtitle = blue;black;bold

[error]
    _default_ = white;red
    errdfocus = black;white
    errdhotnormal = yellow;red;bold
    errdhotfocus = red;white;bold
    errdtitle = white;red;bold

[filehighlight]
    directory = blue;;bold
    executable = green;;bold
    symlink = brightcyan
    hardlink = brightcyan
    stalelink = red
    device = yellow
    special = yellow
    core = gray
    temp = gray
    archive = red
    doc = brightred
    source = brown
    media = magenta
    graph = magenta
    database = cyan

[menu]
    _default_ = lightgray;black
    menusel = black;blue
    menuhot = yellow;black
    menuhotsel = yellow;blue
    menuinactive = gray;black

[popupmenu]
    _default_ = lightgray;black
    menusel = black;blue
    menutitle = blue;black;bold

[buttonbar]
    hotkey = lightgray;default
    button = black;blue

[statusbar]
    _default_ = lightgray;black

[help]
    _default_ = lightgray;black
    helpbold = blue;black;bold
    helpitalic = gray;black;italic
    helplink = brightred;black;underline
    helpslink = black;brightred
    helptitle = blue;black;bold

[editor]
    _default_ = lightgray;default
    editbold = brown;default;bold
    editmarked = black;blue
    editwhitespace = black;default
    editnonprintable = gray;default
    editlinestate = gray;black
    bookmark = lightgray;black
    bookmarkfound = black;yellow
    editrightmargin = black;default
    editbg = ;default
    editframe = black;default
    editframeactive = blue;default
    editframedrag = yellow;default

[viewer]
    _default_ = lightgray;default
    viewbold = brown;default;bold
    viewunderline = brightred;default;underline
    viewselected = black;blue

[diffviewer]
    added = black;green
    changedline = black;blue
    changednew = black;brightblue
    changed = black;blue
    removed = black;red
    error = red;default
