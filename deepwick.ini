# Deepwick for Midnight Commander (24-bit). Needs COLORTERM=truecolor and an
# S-Lang build of mc; otherwise use deepwick16.ini.
[skin]
    description = Deepwick
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[aliases]
    dw_bg = #04041a
    dw_surface = #10192C
    dw_overlay = #1B2140
    dw_selection = #264F78
    dw_muted = #6E7899
    dw_comment = #7A86A8
    dw_fg = #D4D4D4
    dw_blue = #569CD6
    dw_lightblue = #9CDCFE
    dw_cyan = #4FC1FF
    dw_teal = #4EC9B0
    dw_yellow = #DCDCAA
    dw_gold = #D7BA7D
    dw_orange = #CE9178
    dw_rose = #D16969
    dw_magenta = #C586C0
    dw_green = #57A64A
    dw_red = #F44747
    dw_white = #FFFFFF
    dw_diffadded = #152424
    dw_diffremoved = #341123
    dw_diffchanged = #142240
    dw_difftext = #1D3252

[core]
    _default_ = dw_fg;dw_bg
    selected = dw_fg;dw_selection
    marked = dw_yellow;dw_bg;bold
    markselect = dw_yellow;dw_selection;bold
    gauge = dw_bg;dw_blue
    input = dw_fg;dw_surface
    inputunchanged = dw_muted;dw_surface
    inputmark = dw_fg;dw_selection
    inputhistory = dw_fg;dw_surface
    commandhistory = dw_fg;dw_surface
    disabled = dw_muted;dw_surface
    reverse = dw_bg;dw_blue
    commandlinemark = dw_fg;dw_selection
    header = dw_blue;dw_bg;bold
    shadow = dw_muted;dw_overlay

[dialog]
    _default_ = dw_fg;dw_surface
    dfocus = dw_fg;dw_selection
    dhotnormal = dw_gold;dw_surface
    dhotfocus = dw_gold;dw_selection
    dtitle = dw_blue;dw_surface;bold

[error]
    _default_ = dw_white;dw_red
    errdfocus = dw_bg;dw_white
    errdhotnormal = dw_yellow;dw_red;bold
    errdhotfocus = dw_red;dw_white;bold
    errdtitle = dw_white;dw_red;bold

[filehighlight]
    directory = dw_blue;;bold
    executable = dw_green;;bold
    symlink = dw_cyan
    hardlink = dw_cyan
    stalelink = dw_red
    device = dw_gold
    special = dw_gold
    core = dw_muted
    temp = dw_muted
    archive = dw_rose
    doc = dw_orange
    source = dw_yellow
    media = dw_magenta
    graph = dw_magenta
    database = dw_teal

[menu]
    _default_ = dw_fg;dw_surface
    menusel = dw_fg;dw_selection
    menuhot = dw_gold;dw_surface
    menuhotsel = dw_gold;dw_selection
    menuinactive = dw_muted;dw_surface

[popupmenu]
    _default_ = dw_fg;dw_surface
    menusel = dw_fg;dw_selection
    menutitle = dw_blue;dw_surface;bold

[buttonbar]
    hotkey = dw_fg;dw_bg
    button = dw_bg;dw_blue

[statusbar]
    _default_ = dw_fg;dw_surface

[help]
    _default_ = dw_fg;dw_surface
    helpbold = dw_blue;dw_surface;bold
    helpitalic = dw_comment;dw_surface;italic
    helplink = dw_orange;dw_surface;underline
    helpslink = dw_bg;dw_orange
    helptitle = dw_blue;dw_surface;bold

[editor]
    _default_ = dw_fg;dw_bg
    editbold = dw_yellow;dw_bg;bold
    editmarked = dw_fg;dw_selection
    editwhitespace = dw_overlay;dw_bg
    editnonprintable = dw_muted;dw_bg
    editlinestate = dw_muted;dw_surface
    bookmark = dw_fg;dw_overlay
    bookmarkfound = dw_bg;dw_gold
    editrightmargin = dw_overlay;dw_bg
    editbg = ;dw_bg
    editframe = dw_overlay;dw_bg
    editframeactive = dw_blue;dw_bg
    editframedrag = dw_gold;dw_bg

[viewer]
    _default_ = dw_fg;dw_bg
    viewbold = dw_yellow;dw_bg;bold
    viewunderline = dw_orange;dw_bg;underline
    viewselected = dw_fg;dw_selection

[diffviewer]
    added = dw_fg;dw_diffadded
    changedline = dw_fg;dw_diffchanged
    changednew = dw_fg;dw_difftext
    changed = dw_fg;dw_diffchanged
    removed = dw_fg;dw_diffremoved
    error = dw_red;dw_bg
